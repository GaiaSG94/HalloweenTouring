// Convert lat/lon (deg) to a point on a sphere of radius r.
// Matches THREE.SphereGeometry UVs + equirectangular textures (u=0 at lon -180).
function latLonToVec3(lat, lon, r, out) {
  const theta = ((90 - lat) * Math.PI) / 180;
  const phi = ((lon + 180) * Math.PI) / 180;
  out.set(
    -r * Math.sin(theta) * Math.cos(phi),
    r * Math.cos(theta),
    r * Math.sin(theta) * Math.sin(phi),
  );
  return out;
}

const _up = new THREE.Vector3(0, 1, 0);
const _n = new THREE.Vector3();

// Stand a group upright on the globe at lat/lon, facing rotated by faceDeg.
function placeOnGlobe(group, lat, lon, faceDeg, mult) {
  latLonToVec3(lat, lon, GLOBE_R - 0.0002, group.position);
  _n.copy(group.position).normalize();
  group.quaternion.setFromUnitVectors(_up, _n);
  group.rotateY((faceDeg * Math.PI) / 180);
  group.scale.setScalar(SCALE * mult);
  return group;
}

function mat(color, rough = 0.85, metal = 0.0, extra = {}) {

}

function box(w, h, d, material) {

}

function cyl(rt, rb, h, material, seg = 20) {

}

function put(mesh, x, y, z, parent) {
  mesh.position.set(x, y, z);
  parent.add(mesh);
  return mesh;
}

// Tapered beam between two points (legs, arms, braces).
function beamBetween(a, b, r1, r2, material) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r2, r1, len, 10), material);
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(_up, dir.normalize());
  return mesh;
}

// Flat arch panel (rectangle + round top), facing +Z, base at y=0.
function archPanel(w, h, material) {
  const r = w / 2;
  const s = new THREE.Shape();
  s.moveTo(-r, 0);
  s.lineTo(-r, h - r);
  s.absarc(0, h - r, r, Math.PI, 0, true);
  s.lineTo(r, 0);
  s.closePath();
  return new THREE.Mesh(new THREE.ShapeGeometry(s, 12), material);
}

// Soft fake-AO disc to ground a monument on the globe.
function groundDisc(radius, opacity = 0.42) {

}

function canvasTexture(size, draw) {

  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

let _seed = 7;

function makeEarth(s) {

// Blue halo shell (fresnel falloff), slightly larger than the globe.
function makeAtmosphere(s) {
  const material = new THREE.ShaderMaterial({
    uniforms: { glowColor: { value: new THREE.Color(0x4d9fff) } },
    vertexShader: [
      'varying vec3 vNormal;',
      'void main() {',
      '  vNormal = normalize(normalMatrix * normal);',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
      '}',
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 glowColor;',
      'varying vec3 vNormal;',
      'void main() {',
      '  float rim = pow(0.62 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.2);',
      '  gl_FragColor = vec4(glowColor, 1.0) * rim;',
      '}',
    ].join('\n'),
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false,
  });
  const halo = new THREE.Mesh(new THREE.SphereGeometry(GLOBE_R * 1.18, 64, 64), material);
  s.add(halo);

function starSprite() {
  return canvasTexture(64, (ctx, size) => {

    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.85)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
  });
}

function makeStarShell(radius, count, size) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const tints = [[1, 1, 1], [1, 1, 1], [1, 1, 1], [0.74, 0.82, 1], [1, 0.89, 0.75]];

  for (let i = 0; i < count; i++) {
    v.set(srand() * 2 - 1, srand() * 2 - 1, srand() * 2 - 1).normalize().multiplyScalar(radius);
    pos.set([v.x, v.y, v.z], i * 3);
    col.set(tints[Math.floor(srand() * tints.length)], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const points = new THREE.Points(
    geo,
    new THREE.PointsMaterial({
      size, map: starSprite(), vertexColors: true, opacity: 0.9,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    }),
  );
  points.frustumCulled = false;
  return points;
}

  MONUMENTS.forEach((m, i) => {

/* ===== 40_eiffel — Tour Eiffel (Paris) ===== */
function eiffelLegs(g, iron) {
  const feet = [[-21, -21], [21, -21], [-21, 21], [21, 21]];
  for (const [fx, fz] of feet) {
    const sx = Math.sign(fx) * 11;
    const sz = Math.sign(fz) * 11;
    g.add(beamBetween(new THREE.Vector3(fx, 0, fz), new THREE.Vector3(sx, 57, sz), 5.5, 3.4, iron));
    put(box(9, 4, 9, iron), fx, 2, fz, g);
  }
  for (let k = 0; k < 4; k++) {
    const arch = new THREE.Mesh(new THREE.TorusGeometry(16, 2.6, 10, 24, Math.PI), iron);
    arch.position.set(0, 9, 20);
    const holder = new THREE.Group();
    holder.add(arch);
    holder.rotation.y = (k * Math.PI) / 2;
    g.add(holder);
  }
}

function eiffelBraces(g, iron) {
  const levels = [10, 22, 34, 46];
  const halfAt = (y) => 21 - (10 * y) / 57;
  for (const y of levels) {
    const x1 = halfAt(y);
    const x2 = halfAt(y + 10);
    const faces = [
      [new THREE.Vector3(-x1, y, x1), new THREE.Vector3(x2, y + 10, x2), new THREE.Vector3(x1, y, x1), new THREE.Vector3(-x2, y + 10, x2)],
      [new THREE.Vector3(-x1, y, -x1), new THREE.Vector3(x2, y + 10, -x2), new THREE.Vector3(x1, y, -x1), new THREE.Vector3(-x2, y + 10, -x2)],
      [new THREE.Vector3(x1, y, -x1), new THREE.Vector3(x2, y + 10, x2), new THREE.Vector3(x1, y, x1), new THREE.Vector3(x2, y + 10, -x2)],
      [new THREE.Vector3(-x1, y, -x1), new THREE.Vector3(-x2, y + 10, x2), new THREE.Vector3(-x1, y, x1), new THREE.Vector3(-x2, y + 10, -x2)],
    ];
    for (const [a, b, c, d] of faces) {
      g.add(beamBetween(a, b, 1.3, 1.3, iron));
      g.add(beamBetween(c, d, 1.3, 1.3, iron));
    }
  }
}

function eiffelUpper(g, iron) {
  put(box(54, 5, 54, iron), 0, 59.5, 0, g);
  for (const z of [-26, 26]) put(box(54, 2.4, 1, iron), 0, 63, z, g);
  for (const x of [-26, 26]) put(box(1, 2.4, 54, iron), x, 63, 0, g);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {

  put(box(12, 10, 12, iron), 0, 272, 0, g);
  put(cyl(1.4, 1.8, 30, iron, 8), 0, 292, 0, g);
}

function buildEiffel() {

  eiffelBraces(g, iron);

function pyramid(base, h, material) {

  m.rotation.y = Math.PI / 4;
  m.position.y = h / 2;

}

function libertyPedestal(g, stone) {
  put(box(40, 8, 40, stone), 0, 4, 0, g);
  const shaft = cyl(10, 14, 34, stone, 4);
  shaft.rotation.y = Math.PI / 4;

  put(new THREE.Mesh(new THREE.SphereGeometry(3.8, 20, 16), patina), 0, 93.5, 0, g);
}

/* ===== 43_taj — Taj Mahal (Agra) ===== */
function tajOnion(r, h, material) {
  const pts = [
    [r, 0], [r * 1.06, h * 0.18], [r * 0.9, h * 0.45],
    [r * 0.55, h * 0.72], [r * 0.24, h * 0.88], [r * 0.08, h * 0.97], [0.05, h],
  ].map(([x, y]) => new THREE.Vector2(Math.max(x, 0.05), y));
  return new THREE.Mesh(new THREE.LatheGeometry(pts, 28), material);
}

function tajMinaret(g, x, z, marble) {

  put(cyl(2.6, 3.4, 42, marble), x, 32, z, g);
  put(cyl(4.4, 4.4, 2, marble), x, 54, z, g);
  const kiosk = tajOnion(3, 5, marble);
  kiosk.position.set(x, 55, z);
  g.add(kiosk);

/* ===== 46_colosse — Colisée (Rome) ===== */
function colosseArches(g, dark) {
  const geo = new THREE.ShapeGeometry(archPanelShape(7, 13), 8);
  const dummy = new THREE.Object3D();
  for (const baseY of [4, 22]) {
    const inst = new THREE.InstancedMesh(geo, dark, 40);
    for (let i = 0; i < 40; i++) {
      const t = (i / 40) * Math.PI * 2;
      const r = 84 - (6 * (baseY + 6)) / 48;
      const x = Math.cos(t) * r * 1.25;
      const z = Math.sin(t) * r;
      dummy.position.set(x, baseY, z);
      dummy.lookAt(x * 2, baseY, z * 2);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
    g.add(inst);
  }
}

function archPanelShape(w, h) {
  const r = w / 2;
  const s = new THREE.Shape();
  s.moveTo(-r, 0);
  s.lineTo(-r, h - r);
  s.absarc(0, h - r, r, Math.PI, 0, true);
  s.lineTo(r, 0);
  s.closePath();
  return s;
}

function colosseAttic(g, dark) {
  const geo = new THREE.BoxGeometry(3, 4, 0.6);
  const inst = new THREE.InstancedMesh(geo, dark, 40);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < 40; i++) {
    const t = ((i + 0.5) / 40) * Math.PI * 2;
    const x = Math.cos(t) * 79 * 1.25;
    const z = Math.sin(t) * 79;
    dummy.position.set(x, 41, z);
    dummy.lookAt(x * 2, 41, z * 2);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  g.add(inst);
}

/* ===== 48_wall — Grande Muraille de Chine (Badaling) ===== */
// A representative 800 m section snaking over a rocky ridge. The ridge also
// lifts the short wall clear of the globe-sink burial (no round AO disc fits).
function wallPath() {
  const pts = [];
  for (let x = -400; x <= 400; x += 20) {
    const z = 90 * Math.sin(x / 130) + 30 * Math.sin(x / 47);
    pts.push(new THREE.Vector3(x, 0, z));
  }
  return pts;
}

// Drop of the globe surface below the tangent plane (local units).
function wallCurveY(p) {
  return (-(p.x * p.x + p.z * p.z) * SCALE) / 2;
}

function wallYaw(a, b) {
  return Math.atan2(-(b.z - a.z), b.x - a.x);
}

function wallEndDip(i, n) {
  return i === 0 || i === n - 2 ? 7 : 0;
}

function wallRidge(g, pts, rocks) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i];
    const b = pts[i + 1];
    const seg = box(26, 24, 34, rocks[i % 2]);
    seg.position.set((a.x + b.x) / 2, 12 + wallCurveY(a) - wallEndDip(i, pts.length), (a.z + b.z) / 2);
    seg.rotation.y = wallYaw(a, b);
    g.add(seg);
  }
}

function wallBody(g, pts, stones) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i];
    const b = pts[i + 1];
    const seg = box(20.5, 8, 6.5, stones[i % 3]);
    seg.position.set((a.x + b.x) / 2, 28 + wallCurveY(a) - wallEndDip(i, pts.length), (a.z + b.z) / 2);
    seg.rotation.y = wallYaw(a, b);
    g.add(seg);
  }
}

function wallTowers(g, pts, stone, roofMat) {
  for (let i = 4; i < pts.length - 1; i += 8) {
    const a = pts[i];
    const b = pts[i + 1];
    const y = wallCurveY(a);
    const t = box(13, 15, 13, stone);
    t.position.set(a.x, 31.5 + y, a.z);
    t.rotation.y = wallYaw(a, b);
    g.add(t);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(10.5, 6, 4), roofMat);
    roof.rotation.y = wallYaw(a, b) + Math.PI / 4;
    roof.position.set(a.x, 42 + y, a.z);
    g.add(roof);
  }
}

function wallCrenels(g, pts, stone) {
  const geo = new THREE.BoxGeometry(2.2, 1.6, 1.2);
  const per = 5;
  const inst = new THREE.InstancedMesh(geo, stone, (pts.length - 1) * 2 * per);
  const dummy = new THREE.Object3D();
  let k = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i];
    const b = pts[i + 1];
    const yaw = wallYaw(a, b);
    const dx = (b.x - a.x) / per;
    const dz = (b.z - a.z) / per;
    const len = Math.hypot(b.x - a.x, b.z - a.z);
    const nx = (-(b.z - a.z) / len) * 3.2;
    const nz = ((b.x - a.x) / len) * 3.2;
    for (let s = 0; s < per; s++) {
      const px = a.x + dx * (s + 0.5);
      const pz = a.z + dz * (s + 0.5);
      for (const side of [-1, 1]) {
        dummy.position.set(px + nx * side, 32.8 + wallCurveY(a), pz + nz * side);
        dummy.rotation.set(0, yaw, 0);
        dummy.updateMatrix();
        inst.setMatrixAt(k++, dummy.matrix);
      }
    }
  }
  inst.instanceMatrix.needsUpdate = true;
  g.add(inst);
}

function buildWall() {
  const g = new THREE.Group();
  const pts = wallPath();
  const rocks = [mat(0x6b6257, 1, 0), mat(0x756c5e, 1, 0)];
  const stones = [mat(0x9a938a, 0.95, 0), mat(0x8f887e, 0.95, 0), mat(0xa39c90, 0.95, 0)];
  wallRidge(g, pts, rocks);
  wallBody(g, pts, stones);
  wallTowers(g, pts, stones[0], mat(0x4a5a6a, 0.8, 0));
  wallCrenels(g, pts, stones[1]);
  return { group: g, top: 48 };
}
BUILDERS.wall = buildWall;
/* ===== 50_labels — monument name tags projected each frame ===== */
const labelLayer = document.getElementById('labels');
const labelItems = []; // { el, group, topLocal }
function addLabel(name, group, topLocal) {
  const el = document.createElement('div');
  el.className = 'lbl';
  el.textContent = name;
  labelLayer.appendChild(el);
  labelItems.push({ el, group, topLocal });
}

const _lv = new THREE.Vector3();
const _lw = new THREE.Vector3();
const _ln = new THREE.Vector3();
const _lc = new THREE.Vector3();

function uiZones() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const narrow = w < 640;
  return [
    { x0: 0, y0: 0, x1: narrow ? 230 : 360, y1: narrow ? 40 : 64 },
    { x0: w / 2 - 220, y0: h - 58, x1: w / 2 + 220, y1: h },
  ];
}

function labelBox(el, x, y) {
  const bw = el._bw || 18 + el.textContent.length * 6.4;
  const bh = 26;
  let cx = clamp(x, bw / 2 + 6, window.innerWidth - bw / 2 - 6);
  let cy = clamp(y, bh + 8, window.innerHeight - 10);
  const [header, hint] = uiZones();
  let box = { x0: cx - bw / 2, y0: cy - bh, x1: cx + bw / 2, y1: cy };
  if (boxesOverlap(box, header)) {
    cy = header.y1 + bh;
    box = { x0: cx - bw / 2, y0: cy - bh, x1: cx + bw / 2, y1: cy };
  }
  if (boxesOverlap(box, hint)) {
    cy = hint.y0 - 4;
    box = { x0: cx - bw / 2, y0: cy - bh, x1: cx + bw / 2, y1: cy };
  }
  return { ...box, cx, cy };
}

function boxesOverlap(a, b) {
  return !(a.x1 < b.x0 || a.x0 > b.x1 || a.y1 < b.y0 || a.y0 > b.y1);
}

function updateLabels() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const cands = [];
  for (const { el, group, topLocal } of labelItems) {
    group.getWorldPosition(_lw);
    _ln.copy(_lw).normalize();
    _lc.copy(camera.position).sub(_lw).normalize();
    const facing = _ln.dot(_lc);
    _lv.set(0, topLocal, 0).applyMatrix4(group.matrixWorld).project(camera);
    if (facing > 0.3 && _lv.z < 1) {
      cands.push({ el, facing, x: (_lv.x * 0.5 + 0.5) * w, y: (-_lv.y * 0.5 + 0.5) * h });
    } else {
      el.style.display = 'none';
    }
  }
  cands.sort((a, b) => b.facing - a.facing);
  const placed = [];
  for (const c of cands) {
    let box = labelBox(c.el, c.x, c.y);
    if (placed.some((p) => boxesOverlap(box, p))) {
      c.el.style.display = 'none';
    } else {
      placed.push(box);
      c.el.style.display = 'block';
      if (!c.el._bw && c.el.offsetWidth) {
        c.el._bw = c.el.offsetWidth + 2;
        box = labelBox(c.el, c.x, c.y);
      }
      c.el.style.transform =
        `translate(${box.cx.toFixed(1)}px, ${box.cy.toFixed(1)}px) translate(-50%,-100%)`;
    }
  }
}
/* ===== 60_input — drag to spin, wheel/pinch to zoom ===== */
const input = { dragging: false, lastX: 0, lastY: 0, lastEnd: 0, pinchD: 0 };

function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

function zoomBy(f) {
  camera.position.z = clamp(camera.position.z * f, CAM.zMin, CAM.zMax);
}

function pinchDist(m) {
  const [a, b] = [...m.values()];
  return Math.hypot(a[0] - b[0], a[1] - b[1]);
}

function setupInput() {
  const el = renderer.domElement;
  const pointers = new Map();
  el.addEventListener('pointerdown', (e) => {
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 1) {
      input.dragging = true;
      input.lastX = e.clientX;
      input.lastY = e.clientY;
    } else if (pointers.size === 2) {
      input.dragging = false;
      input.pinchD = pinchDist(pointers);
    }
  });
  el.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 1 && input.dragging) {
      const dx = e.clientX - input.lastX;
      const dy = e.clientY - input.lastY;
      input.lastX = e.clientX;
      input.lastY = e.clientY;
      spinGroup.rotation.y += dx * 0.0055;
      tiltGroup.rotation.x = clamp(tiltGroup.rotation.x + dy * 0.004, -TILT_MAX, TILT_MAX);
    } else if (pointers.size === 2) {
      const d = pinchDist(pointers);
      if (input.pinchD > 0 && d > 0) zoomBy(input.pinchD / d);
      input.pinchD = d;
    }
  });
  const up = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      input.dragging = false;
      input.lastEnd = performance.now();
    } else if (pointers.size === 1) {
      const [x, y] = [...pointers.values()][0];
      input.dragging = true;
      input.lastX = x;
      input.lastY = y;
    }
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomBy(1 + e.deltaY * 0.0011);
  }, { passive: false });
}
/* ===== 70_loop — monuments, resize, main loop, boot ===== */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function buildMonuments() {
  for (const m of MONUMENTS) {
    const { group, top } = BUILDERS[m.id]();
    placeOnGlobe(group, m.lat, m.lon, m.face, m.mult);
    spinGroup.add(group);
    addLabel(m.name, group, top);
  }
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// Distance fitting the whole globe on narrow portrait screens.
function portraitFitZ() {
  const vHalf = (CAM.fov * Math.PI) / 360;
  const aspect = window.innerWidth / window.innerHeight;
  return Math.min(CAM.zMax, 1.32 / (Math.tan(vHalf) * aspect));
}

let prevT = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - prevT) / 1000, 0.1);
  prevT = now;
  if (!reduceMotion && !input.dragging && now - input.lastEnd > RESUME_MS) {
    spinGroup.rotation.y += AUTO_SPEED * dt;
  }
  renderer.render(scene, camera);
  updateLabels();
}

try {
  buildScene();
  setupInput();
  buildMonuments();
  if (window.innerWidth < window.innerHeight) camera.position.z = portraitFitZ();
  if (window.matchMedia('(pointer: coarse)').matches) {
    document.getElementById('hint').textContent = 'Glisser : tourner · Pincer : zoomer';
  }
  onResize();
  window.addEventListener('resize', onResize);
  animate();
} catch (err) {
  showError('Erreur au démarrage : ' + (err && err.message ? err.message : err));
}
